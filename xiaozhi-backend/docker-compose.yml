services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-}
      XIAOZHI_DEVICE_TOKEN: ${XIAOZHI_DEVICE_TOKEN:-}
      XIAOZHI_INPUT_SAMPLE_RATE: ${XIAOZHI_INPUT_SAMPLE_RATE:-16000}
      XIAOZHI_SERVER_SAMPLE_RATE: ${XIAOZHI_SERVER_SAMPLE_RATE:-24000}
      XIAOZHI_FRAME_DURATION_MS: ${XIAOZHI_FRAME_DURATION_MS:-60}
      ASR_MODEL: ${ASR_MODEL:-}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-}
      ASR_LOCAL_FILES_ONLY: ${ASR_LOCAL_FILES_ONLY:-true}
      LANGUAGE_HINT_MIN_PROBABILITY: ${LANGUAGE_HINT_MIN_PROBABILITY:-0.80}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      AI_PIPELINE_TIMEOUT_SECONDS: ${AI_PIPELINE_TIMEOUT_SECONDS:-120}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      TTS_MODEL_VI: ${TTS_MODEL_VI:-}
      TTS_MODEL_EN: ${TTS_MODEL_EN:-}
      TTS_DEFAULT_LANGUAGE: ${TTS_DEFAULT_LANGUAGE:-vi}
      MODEL_DEVICE: ${MODEL_DEVICE:-auto}
      VAD_ENABLED: ${VAD_ENABLED:-true}
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.4}
      VAD_MIN_SILENCE_MS: ${VAD_MIN_SILENCE_MS:-500}
      VAD_SPEECH_PAD_MS: ${VAD_SPEECH_PAD_MS:-200}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-30}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-2097152}
      AUTO_STOP_TIMEOUT_SECONDS: ${AUTO_STOP_TIMEOUT_SECONDS:-4}
      HELLO_TIMEOUT_SECONDS: ${HELLO_TIMEOUT_SECONDS:-10}
      TIMEZONE_OFFSET_MINUTES: ${TIMEZONE_OFFSET_MINUTES:-420}
    restart: unless-stopped
